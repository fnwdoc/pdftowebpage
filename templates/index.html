<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Webpage Converter</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 2em; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 2em; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #4a4a4a; text-align: center; }
        form { display: flex; flex-direction: column; gap: 1em; }
        input[type=file] { border: 1px solid #ddd; padding: 0.5em; border-radius: 4px; }
        input[type=submit] { background-color: #007bff; color: white; padding: 0.7em; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        input[type=submit]:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PDF to Webpage Converter</h1>
        <p>Upload a PDF file to convert it into an HTML page.</p>
        <form method="post" enctype="multipart/form-data" action="{{ url_for('upload_file') }}">
            <input type="file" name="file" required>
            <input type="submit" value="Convert to HTML">
        </form>
    </div>
</body>
</html>
